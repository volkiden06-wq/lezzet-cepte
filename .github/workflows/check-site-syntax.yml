name: YEMEK TADINDA - Site syntax check

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - ".github/workflows/check-site-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript in index.html
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/type=["']application\/ld\+json["']/i.test(match[1]))
            .map(match => match[2])
            .filter(source => source.trim().length > 0);
          if (blocks.length === 0) {
            throw new Error('No inline JavaScript blocks found in index.html');
          }
          blocks.forEach((source, index) => {
            const file = path.join(os.tmpdir(), `yemektadinda-inline-${index}.js`);
            fs.writeFileSync(file, source, 'utf8');
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          console.log(`Syntax OK: ${blocks.length} inline script block(s).`);
          NODE
      - name: Check service worker
        run: node --check sw.js
