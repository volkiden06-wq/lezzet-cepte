name: Build YEMEK TADINDA Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prevent accidental replacement of the first signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The first signed APK already exists. Do not create a new signing identity."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create one-time private release signing key
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/yemek-tadinda-signing"
          mkdir -p "$SIGN_DIR"
          PASS="$(openssl rand -hex 32)"
          KEYSTORE="$SIGN_DIR/yemek-tadinda-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias "yemek-tadinda" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=YEMEK TADINDA, O=YEMEK TADINDA, C=TR"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=yemek-tadinda"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace -p android-app :app:assembleRelease

      - name: Verify APK and create Digital Asset Links file
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          FINGERPRINT="$(keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test -n "$FINGERPRINT"

          mkdir -p release-files
          cp "$APK" release-files/YEMEK-TADINDA.apk
          printf '%s\n' "$FINGERPRINT" > release-files/signing-certificate-sha256.txt
          cat > release-files/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.yemektadinda.app",
                "sha256_cert_fingerprints": ["$FINGERPRINT"]
              }
            }
          ]
          EOF

      - name: Publish domain association file
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILE=".well-known/assetlinks.json"
          CONTENT="$(base64 -w 0 release-files/assetlinks.json)"
          EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
              -f message="Publish YEMEK TADINDA Android domain verification" \
              -f content="$CONTENT" -f sha="$EXISTING_SHA"
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
              -f message="Publish YEMEK TADINDA Android domain verification" \
              -f content="$CONTENT"
          fi

      - name: Publish signed APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create android-v1.0.0 \
            release-files/YEMEK-TADINDA.apk \
            release-files/signing-certificate-sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "YEMEK TADINDA Android 1.0.0" \
            --notes "YEMEK TADINDA Android uygulaması. Mevcut yemektadinda.com sitesini Android uygulama görünümünde açar. Web sitesindeki ürün, menü ve sipariş değişiklikleri uygulamaya doğrudan yansır."

      - name: Upload non-secret build metadata
        uses: actions/upload-artifact@v4
        with:
          name: yemek-tadinda-android-build-metadata
          path: |
            release-files/assetlinks.json
            release-files/signing-certificate-sha256.txt
          retention-days: 30
